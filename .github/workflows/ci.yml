name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs the lockfile exactly and
      # fails if the manifest and lockfile disagree, which is the behaviour CI
      # wants and a developer's machine does not.
      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Ensure no secrets are tracked
        # A committed credential cannot be un-published, so this is checked on
        # every run rather than trusting .gitignore to stay correct.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git — it must never be committed"
            exit 1
          fi
          echo "No .env in the index."

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is what .nvmrc pins and what development uses; 22 is the floor the
        # manifest claims to support, and claiming it untested is worse than not
        # claiming it.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: Deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint the deployment scripts
        run: shellcheck --severity=style deploy/install.sh deploy/test-install.sh

      # Run for real rather than read. This script's failures happen on a Pi, over
      # ssh, with the previous bundle already replaced — which is the worst place to
      # find out that a path was wrong. The runner is a throwaway VM, so it installs
      # into its /opt and writes its /etc the way it would on the real thing.
      - name: Install a bundle onto a throwaway filesystem
        run: sudo env PIHOME_WEB_DEPLOY_TEST=1 bash deploy/test-install.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build, and verify no hub credential reached the bundle
        # The client holds no credential at all now — it logs in, and the token
        # comes back in a cookie it cannot read. This guards against that being
        # undone: the dev proxy used to attach an API key in Node, and Vite
        # inlines every VITE_-prefixed variable into the output, so reintroducing
        # one under the wrong name would put it in front of anyone who opens
        # devtools. Building with a canary value and grepping dist/ is what makes
        # the README's claim something CI enforces rather than something it says.
        env:
          PIHOME_RELAY_API_KEY: canary-must-never-be-bundled
          PIHOME_HUB_ORIGIN: http://127.0.0.1:5002
        run: |
          npm run build
          if grep -rq "canary-must-never-be-bundled" dist/; then
            echo "::error::the hub API key reached the built bundle"
            exit 1
          fi
          echo "No credential in dist/."
